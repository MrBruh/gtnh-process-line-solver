# Dependabot keeps the GitHub Actions and Python dependency floors current.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # The hook revs in .pre-commit-config.yaml were watched by nothing, which is how the ruff hook
  # came to sit 14 patch releases behind the ruff the dev extra resolved.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
