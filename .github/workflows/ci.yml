name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more raise their own scope.
permissions:
  contents: read

# Cancel an in-flight run when a newer commit supersedes it on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"  # the one supported version (requires-python)
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install
        # -c pins the dev toolchain (see constraints-dev.txt): the checks are only
        # meaningful if every run makes them with the same tools.
        run: pip install -e ".[dev]" -c constraints-dev.txt
      # Runs the same hooks as local pre-commit: ruff (lint + format), mypy --strict,
      # and file hygiene. Single source of truth for "what static checks mean here".
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  pytest:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is ">=3.14", so the floor is also the newest release and one leg
        # covers both. It used to run the floor and the latest on the reasoning that the
        # intermediates would pass whenever both ends did, and #255 was the counterexample: a
        # stdlib rule only 3.11 enforced broke the package there with both legs green. When a
        # newer release lands, add it here and keep the coverage include below on the newest.
        python-version: ["3.14"]
        # Coverage is gated on ONE leg (the number is interpreter-independent, and the tracer
        # used to cost ~3/4 of every leg's wall clock - issue #74). It rides the latest leg
        # because sys.monitoring can only measure BRANCH coverage on 3.14+; keep this include
        # pointed at the newest matrix entry when the version list moves.
        include:
          - python-version: "3.14"
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install
        # -c pins the dev toolchain (see constraints-dev.txt): the checks are only
        # meaningful if every run makes them with the same tools.
        run: pip install -e ".[dev]" -c constraints-dev.txt
      - name: Test
        if: ${{ !matrix.coverage }}
        run: pytest --no-cov
      - name: Test (coverage gate)
        if: ${{ matrix.coverage }}
        env:
          COVERAGE_CORE: sysmon  # sys.monitoring core: branch-capable and cheap on 3.14+
        run: pytest --cov-fail-under=90

  # Single stable required status check for branch protection. The matrix produces
  # per-version check names that change whenever the version list changes, so instead of
  # requiring those, require this one `test` gate: it passes only if BOTH the static
  # checks and every matrix leg passed. `if: always()` so a failed dependency still runs
  # the gate and fails it (a skipped required check would otherwise be treated as passing).
  test:
    name: test
    needs: [static, pytest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on lint/types + the full test matrix
        run: |
          echo "static=${{ needs.static.result }} pytest=${{ needs.pytest.result }}"
          [ "${{ needs.static.result }}" = "success" ] && [ "${{ needs.pytest.result }}" = "success" ]

  commits:
    name: Commit messages (Conventional Commits, advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Advisory only: non-conforming commit messages are surfaced in the logs but do
      # not block the merge. The local commit-msg pre-commit hook is the real nudge.
      - uses: webiny/action-conventional-commits@v1.4.2
        continue-on-error: true
